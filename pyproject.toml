[project]
name = "hotelforecast"
version = "0.1.0"
description = "Prévision de la demande hôtelière par séries temporelles hiérarchiques, avec backtesting à origine glissante."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "statsforecast>=1.7",
    "holidays>=0.50",
    "vacances-scolaires-france>=0.10",
    "typer>=0.12",
    "matplotlib>=3.8",
    "streamlit>=1.35",
    "plotly>=5.20",
    "clickhouse-connect>=0.7",
]

[project.scripts]
hotelforecast = "hotelforecast.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7", "dbt-clickhouse>=1.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotelforecast"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
